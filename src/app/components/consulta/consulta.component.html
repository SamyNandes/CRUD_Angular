<div fxLayout="column" fxLayoutAlign="center center" fxFlex="100%">
  <div fxLayout="column">
        <form class="mt-60" (ngSubmit)="procurarDadosUsuario()">
        <mat-card>
            <mat-card-header>
                <mat-card-title>Consulta</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <div fxLayout="row" fxLayoutAlign="start">
                    <div fxLayout="column" fxFlex="500px" class="mt-20">
                      <mat-form-field appearance="fill">
                        <mat-label>Procurar seu usuário</mat-label>
                        <input type="text" [(ngModel)]="inputUsuarioParaProcurar" name="inputUsuarioParaProcurar" matInput placeholder="procurar usuario">
                      </mat-form-field>
                    </div>
                </div>
            </mat-card-content>
            <mat-card-actions class="ml-5">
                <button mat-flat-button type="submit" color="primary"><mat-icon fontIcon="search"></mat-icon>Buscar</button>
            </mat-card-actions>
        </mat-card>
    </form>
    </div>
    <div fxLayout="column" fxFlex="" class="mt-20">
      <mat-card class="mt-20">
        <mat-card-header>
          <mat-card-title>
            Usuarios:
          </mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div fxLayout="row" fxLayoutAlign="start">
            <div fxLayout="column" fxFlex="" class="mt-20">
              <table mat-table [dataSource]="dadosDoUsuarioParaMostrar" >
                <ng-container matColumnDef="nome">
                  <th mat-header-cell *matHeaderCellDef>Nome</th>
                  <td mat-cell *matCellDef="let element"> {{ element.nome }}</td>
                </ng-container>
                <ng-container matColumnDef="cpf">
                  <th mat-header-cell *matHeaderCellDef>CPF</th>
                  <td mat-cell *matCellDef="let element"> {{ element.cpf }}</td>
                </ng-container>
                <ng-container matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef>Email</th>
                  <td mat-cell *matCellDef="let element"> {{ element.email }}</td>
                </ng-container>
                <ng-container matColumnDef="dataDeNascimento">
                  <th mat-header-cell *matHeaderCellDef>Data de nascimento</th>
                  <td mat-cell *matCellDef="let element"> {{ element.dataDeNascimento }}</td>
                </ng-container>
                <ng-container matColumnDef="id">
                  <th mat-header-cell *matHeaderCellDef>id</th>
                  <td mat-cell *matCellDef="let element"> {{ element.id }}</td>
                </ng-container>
                <ng-container matColumnDef="botao">
                  <th mat-header-cell *matHeaderCellDef></th>
                  <td mat-cell *matCellDef="let element">
                    <button mat-button (click)="prepararEditar(element.id)"><mat-icon fontIcon="edit"></mat-icon>Editar</button>
                    <div *ngIf="!element.deletando; else containerPergunta">
                      <button mat-button type="button" (click)="prepararRemover(element)"> <mat-icon fontIcon="delete"></mat-icon> Remover</button>
                    </div>
                    <ng-template #containerPergunta>
                      <button mat-button type="button" (click)="remover(element.id)"><mat-icon fontIcon="question_mark" ></mat-icon> Confirma</button>
                    </ng-template>
                  </td>

                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
              </table>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
</div>
